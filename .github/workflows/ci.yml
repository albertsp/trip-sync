name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values: the tests never talk to Google, but Spring requires the properties to exist.
  GOOGLE_CLIENT_ID: ci
  GOOGLE_CLIENT_SECRET: ci

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tripsync
          POSTGRES_PASSWORD: tripsync123
          POSTGRES_DB: tripsync_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        env:
          # Enables PostgresFlowTest: the full feature against the service container above.
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/tripsync_data
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tripsync
          POSTGRES_PASSWORD: tripsync123
          POSTGRES_DB: tripsync_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start the backend
        working-directory: backend
        run: |
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/ping > /dev/null && exit 0
            sleep 2
          done
          echo "Backend did not start in time" && cat backend.log && exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_APP_BASE_URL: http://localhost:5173
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Show backend log
        if: failure()
        run: cat backend/backend.log
