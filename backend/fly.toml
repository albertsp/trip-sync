# fly.toml app configuration file generated for trip-sync-api on 2026-09-21T10:01:50+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trip-sync-api'
primary_region = 'cdg'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[env]
  SPRING_PROFILES_ACTIVE = "prod"