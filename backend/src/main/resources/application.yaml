spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tripsync_data}
    username: ${DATABASE_USERNAME:tripsync}
    password: ${DATABASE_PASSWORD:tripsync123}
  flyway:
    # Databases created before Flyway (ddl-auto=update) are baselined at V1 instead of re-running it.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "${OAUTH2_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    same-site: ${COOKIE_SAME_SITE:Lax}
    secure: ${COOKIE_SECURE:false}
  llm:
    provider: ${LLM_PROVIDER:openai-compatible} # openai-compatible | fake (fake only for dev/e2e)
    base-url: ${LLM_BASE_URL:https://api.mistral.ai/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:ministral-14b-latest}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:8192}
    timeout-ms: ${LLM_TIMEOUT_MS:60000}
    max-generations-per-trip: ${LLM_MAX_GENERATIONS_PER_TRIP:3}
    max-plan-generations-per-trip: ${LLM_MAX_PLAN_GENERATIONS_PER_TRIP:2}
    cooldown-seconds: ${LLM_COOLDOWN_SECONDS:60}
    max-generations-per-day: ${LLM_MAX_GENERATIONS_PER_DAY:50}
    min-participants: ${LLM_MIN_PARTICIPANTS:3}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${app.cookie.same-site}
        secure: ${app.cookie.secure}