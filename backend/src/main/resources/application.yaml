spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/tripsync_data
    username: tripsync
    password: tripsync123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email